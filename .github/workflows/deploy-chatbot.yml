name: Deploy Chatbot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama a desplegar
        required: true
        default: sandbox
      action:
        description: Tipo de despliegue
        required: true
        default: full
        type: choice
        options:
          - full
          - backend
          - frontend
      requested_by_email:
        description: Email del solicitante
        required: false
        default: ""
      requested_by_name:
        description: Nombre del solicitante
        required: false
        default: ""
      trigger_source:
        description: Origen del despliegue
        required: false
        default: ""

concurrency:
  group: chatbot-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: chatbot-api
  WEBSITE_PORT: "8000"
  STATIC_WEB_APP_HOST: https://chatbot.appregenera.com
  STATIC_WEB_APP_API_BASE: https://chatbot.appregenera.com/api
  ALLOWED_ORIGINS: https://chatbot.appregenera.com,http://127.0.0.1:8000,http://localhost:8000
  OPENAI_MODEL: gpt-5.4-nano
  OPENAI_BASELINE_MODEL: gpt-5.4-nano
  LLM_SECONDARY_MODEL: gpt-4.1-mini
  LLM_FALLBACK_MODEL: gpt-4.1-mini
  OPENAI_TIMEOUT_SECS: "45"
  OPENAI_MAX_RETRIES: "1"
  LOG_LEVEL: INFO
  RAG_BACKEND: azure_search
  AZURE_SEARCH_INDEX_NAME: idx-chatbot-rag
  AZURE_SEARCH_VECTOR_FIELD: content_vector
  BLOB_CONTAINER_NAME: documentos-rag
  BLOB_PREFIX: ""
  BLOB_PREFIX_ALTA_TENSION: alta_tension/
  BLOB_PREFIX_BAJA_TENSION: baja_tension/
  BLOB_PREFIX_FOTOVOLTAICA_OM: fotovoltaica_om/
  BLOB_PREFIX_GRUPOS_ELECTROGENOS: grupos_electrogenos/
  BLOB_PREFIX_GUIAS_TECNICAS: guias_tecnicas/
  BLOB_PREFIX_RITE: rite/
  TOP_K_RESULTS: "5"
  ENABLE_RERANK: "true"
  EMBEDDING_MODEL: intfloat/multilingual-e5-small
  EMBEDDING_FP16: "false"
  EMBEDDING_QUERY_PREFIX: "query:"
  EMBEDDING_PASSAGE_PREFIX: "passage:"
  RERANK_MODEL: intfloat/multilingual-e5-small
  RERANK_MODEL_REVISION: ""
  RAG_INDEX_VERSION: "4"
  RERANK_WEIGHT: "9.0"
  MAX_CHUNKS_PER_SOURCE: "4"
  MIN_QUERY_LENGTH: "4"
  MEMORY_COLLECTION_NAME: reglamentos_memoria_validada
  MEMORY_MAX_RESULTS: "3"
  MEMORY_MAX_DISTANCE: "0.6"
  CONFIDENCE_FALLBACK_THRESHOLD: "0.65"
  FALLBACK_MIN_CONFIDENCE_GAP: "0.07"
  FALLBACK_MAX_BASE_CONFIDENCE: "0.72"
  FALLBACK_MIN_RETRIEVAL_QUALITY: mixed
  CONVERSATION_LOCK_TIMEOUT_SECS: "60"
  CHATBOT_FRONTEND_URL: https://chatbot.appregenera.com
  GITHUB_REPOSITORY_OWNER: CarrilloRegenera
  GITHUB_REPOSITORY_NAME: ChatBot
  GITHUB_DEPLOY_WORKFLOW: deploy-chatbot.yml
  GITHUB_DEPLOY_BRANCH: sandbox
  ENTRA_ENABLED: "true"
  ENTRA_TENANT_ID: 6562b8d1-5dc3-4354-bd8f-25993fa24154
  ENTRA_CLIENT_ID: ebbcc0d0-1762-4d34-9229-baee8d9a6ee6
  ENTRA_API_SCOPE: api://ea8827b5-a433-4a75-bbe4-1770aeb16631/access_as_user
  ENTRA_ADMIN_EMAILS: it@regeneraenergy.es,jcanete@regeneraenergy.es
  APPREGENERA_API_BASE_URL: https://api-appregenera-pro-amgxcba0awffdjcd.westeurope-01.azurewebsites.net
  APPREGENERA_ALLOWED_MODULES: estudios,produccion
  SYNC_DOCUMENTS_ON_STARTUP: "false"
  RUN_SCHEMA_MIGRATIONS: "0"

jobs:
  deploy:
    name: Deploy Chatbot PRO
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        if: ${{ inputs.action == 'full' || inputs.action == 'frontend' }}
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve deployment metadata
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) { throw "Falta repo/environment variable AZURE_RESOURCE_GROUP" }
          if ([string]::IsNullOrWhiteSpace($env:WEBAPP_NAME)) { throw "Falta repo/environment variable AZURE_WEBAPP_NAME" }

          $hostName = az webapp show --resource-group $env:RESOURCE_GROUP --name $env:WEBAPP_NAME --query defaultHostName -o tsv
          if (-not $hostName) { throw "No se pudo obtener el defaultHostName del App Service" }

          $backendUrl = "https://$hostName"
          $imageTag = "${{ github.run_number }}-${{ github.sha }}".Substring(0, [Math]::Min(20, "${{ github.run_number }}-${{ github.sha }}".Length))

          "BACKEND_URL=$backendUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_TAG=$imageTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and push backend image in ACR
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACR_NAME)) { throw "Falta repo/environment variable AZURE_ACR_NAME" }

          az acr build `
            --registry $env:ACR_NAME `
            --image "$env:IMAGE_REPO`:$env:IMAGE_TAG" `
            --image "$env:IMAGE_REPO`:latest" `
            --build-arg "EMBEDDING_MODEL=$env:EMBEDDING_MODEL" `
            --build-arg "EMBEDDING_FP16=$env:EMBEDDING_FP16" `
            --build-arg "EMBEDDING_QUERY_PREFIX=$env:EMBEDDING_QUERY_PREFIX" `
            --build-arg "EMBEDDING_PASSAGE_PREFIX=$env:EMBEDDING_PASSAGE_PREFIX" `
            --build-arg "RERANK_MODEL=$env:RERANK_MODEL" `
            --build-arg "RERANK_MODEL_REVISION=$env:RERANK_MODEL_REVISION" `
            --build-arg "RAG_INDEX_VERSION=$env:RAG_INDEX_VERSION" `
            --build-arg "HF_TOKEN=$env:HF_TOKEN" `
            --build-arg "HUGGINGFACE_HUB_TOKEN=$env:HUGGINGFACE_HUB_TOKEN" `
            --file src/backend/Dockerfile `
            src

      - name: Configure backend container
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.AZURE_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACR_LOGIN_SERVER)) { throw "Falta repo/environment variable AZURE_ACR_LOGIN_SERVER" }

          az webapp config container set `
            --name $env:WEBAPP_NAME `
            --resource-group $env:RESOURCE_GROUP `
            --container-image-name "$env:ACR_LOGIN_SERVER/$env:IMAGE_REPO`:$env:IMAGE_TAG" `
            --container-registry-url "https://$env:ACR_LOGIN_SERVER" `
            --container-registry-user $env:ACR_USERNAME `
            --container-registry-password $env:ACR_PASSWORD `
            --enable-app-service-storage false

      - name: Apply backend app settings
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY: ${{ secrets.AZURE_SEARCH_KEY }}
          BLOB_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}
          APPREGENERA_SQL_CONNECTION_STRING: ${{ secrets.APPREGENERA_SQL_CONNECTION_STRING }}
          APPREGENERA_DEV_BYPASS_KEY: ${{ secrets.APPREGENERA_DEV_BYPASS_KEY }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.CHATBOT_GH_DEPLOY_TOKEN }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          GRAPH_EMAIL_TENANT_ID: ${{ secrets.GRAPH_EMAIL_TENANT_ID }}
          GRAPH_EMAIL_CLIENT_ID: ${{ secrets.GRAPH_EMAIL_CLIENT_ID }}
          GRAPH_EMAIL_CLIENT_SECRET: ${{ secrets.GRAPH_EMAIL_CLIENT_SECRET }}
          GRAPH_EMAIL_FROM_USER: ${{ secrets.GRAPH_EMAIL_FROM_USER }}
        run: |
          $settings = @(
            "WEBSITES_ENABLE_APP_SERVICE_STORAGE=false",
            "WEBSITES_PORT=$env:WEBSITE_PORT",
            "PORT=$env:WEBSITE_PORT",
            "WEBSITES_CONTAINER_START_TIME_LIMIT=1800",
            "WEBSITE_WARMUP_PATH=/health",
            "WEBSITE_WARMUP_STATUSES=200",
            "SQL_CONNECTION_STRING=$env:SQL_CONNECTION_STRING",
            "OPENAI_API_KEY=$env:OPENAI_API_KEY",
            "HF_TOKEN=$env:HF_TOKEN",
            "HUGGINGFACE_HUB_TOKEN=$env:HUGGINGFACE_HUB_TOKEN",
            "DEPLOY_IMAGE_TAG=$env:IMAGE_TAG",
            "OPENAI_MODEL=$env:OPENAI_MODEL",
            "OPENAI_BASELINE_MODEL=$env:OPENAI_BASELINE_MODEL",
            "LLM_SECONDARY_MODEL=$env:LLM_SECONDARY_MODEL",
            "LLM_FALLBACK_MODEL=$env:LLM_FALLBACK_MODEL",
            "OPENAI_TIMEOUT_SECS=$env:OPENAI_TIMEOUT_SECS",
            "OPENAI_MAX_RETRIES=$env:OPENAI_MAX_RETRIES",
            "ALLOWED_ORIGINS=$env:ALLOWED_ORIGINS",
            "SYNC_DOCUMENTS_ON_STARTUP=$env:SYNC_DOCUMENTS_ON_STARTUP",
            "RUN_SCHEMA_MIGRATIONS=$env:RUN_SCHEMA_MIGRATIONS",
            "LOG_LEVEL=$env:LOG_LEVEL",
            "ADMIN_API_KEY=$env:ADMIN_API_KEY",
            "Email__Enabled=true",
            "Email__Provider=Graph",
            "GraphEmail__TenantId=$env:GRAPH_EMAIL_TENANT_ID",
            "GraphEmail__ClientId=$env:GRAPH_EMAIL_CLIENT_ID",
            "GraphEmail__ClientSecret=$env:GRAPH_EMAIL_CLIENT_SECRET",
            "GraphEmail__FromUser=$env:GRAPH_EMAIL_FROM_USER",
            "RAG_BACKEND=$env:RAG_BACKEND",
            "AZURE_SEARCH_ENDPOINT=$env:AZURE_SEARCH_ENDPOINT",
            "AZURE_SEARCH_KEY=$env:AZURE_SEARCH_KEY",
            "AZURE_SEARCH_INDEX_NAME=$env:AZURE_SEARCH_INDEX_NAME",
            "AZURE_SEARCH_VECTOR_FIELD=$env:AZURE_SEARCH_VECTOR_FIELD",
            "BLOB_STORAGE_CONNECTION_STRING=$env:BLOB_STORAGE_CONNECTION_STRING",
            "BLOB_CONTAINER_NAME=$env:BLOB_CONTAINER_NAME",
            "BLOB_PREFIX=$env:BLOB_PREFIX",
            "BLOB_PREFIX_ALTA_TENSION=$env:BLOB_PREFIX_ALTA_TENSION",
            "BLOB_PREFIX_BAJA_TENSION=$env:BLOB_PREFIX_BAJA_TENSION",
            "BLOB_PREFIX_FOTOVOLTAICA_OM=$env:BLOB_PREFIX_FOTOVOLTAICA_OM",
            "BLOB_PREFIX_GRUPOS_ELECTROGENOS=$env:BLOB_PREFIX_GRUPOS_ELECTROGENOS",
            "BLOB_PREFIX_GUIAS_TECNICAS=$env:BLOB_PREFIX_GUIAS_TECNICAS",
            "BLOB_PREFIX_RITE=$env:BLOB_PREFIX_RITE",
            "TOP_K_RESULTS=$env:TOP_K_RESULTS",
            "ENABLE_RERANK=$env:ENABLE_RERANK",
            "EMBEDDING_MODEL=$env:EMBEDDING_MODEL",
            "EMBEDDING_FP16=$env:EMBEDDING_FP16",
            "EMBEDDING_QUERY_PREFIX=$env:EMBEDDING_QUERY_PREFIX",
            "EMBEDDING_PASSAGE_PREFIX=$env:EMBEDDING_PASSAGE_PREFIX",
            "RERANK_MODEL=$env:RERANK_MODEL",
            "RERANK_MODEL_REVISION=$env:RERANK_MODEL_REVISION",
            "RAG_INDEX_VERSION=$env:RAG_INDEX_VERSION",
            "RERANK_WEIGHT=$env:RERANK_WEIGHT",
            "MAX_CHUNKS_PER_SOURCE=$env:MAX_CHUNKS_PER_SOURCE",
            "MIN_QUERY_LENGTH=$env:MIN_QUERY_LENGTH",
            "MEMORY_COLLECTION_NAME=$env:MEMORY_COLLECTION_NAME",
            "MEMORY_MAX_RESULTS=$env:MEMORY_MAX_RESULTS",
            "MEMORY_MAX_DISTANCE=$env:MEMORY_MAX_DISTANCE",
            "CONFIDENCE_FALLBACK_THRESHOLD=$env:CONFIDENCE_FALLBACK_THRESHOLD",
            "FALLBACK_MIN_CONFIDENCE_GAP=$env:FALLBACK_MIN_CONFIDENCE_GAP",
            "FALLBACK_MAX_BASE_CONFIDENCE=$env:FALLBACK_MAX_BASE_CONFIDENCE",
            "FALLBACK_MIN_RETRIEVAL_QUALITY=$env:FALLBACK_MIN_RETRIEVAL_QUALITY",
            "CONVERSATION_LOCK_TIMEOUT_SECS=$env:CONVERSATION_LOCK_TIMEOUT_SECS",
            "ENTRA_ENABLED=$env:ENTRA_ENABLED",
            "ENTRA_TENANT_ID=$env:ENTRA_TENANT_ID",
            "ENTRA_CLIENT_ID=$env:ENTRA_CLIENT_ID",
            "ENTRA_API_SCOPE=$env:ENTRA_API_SCOPE",
            "ENTRA_ADMIN_EMAILS=$env:ENTRA_ADMIN_EMAILS",
            "CHATBOT_FRONTEND_URL=$env:CHATBOT_FRONTEND_URL",
            "GITHUB_REPOSITORY_OWNER=$env:GITHUB_REPOSITORY_OWNER",
            "GITHUB_REPOSITORY_NAME=$env:GITHUB_REPOSITORY_NAME",
            "GITHUB_DEPLOY_WORKFLOW=$env:GITHUB_DEPLOY_WORKFLOW",
            "GITHUB_DEPLOY_BRANCH=$env:GITHUB_DEPLOY_BRANCH",
            "GITHUB_DEPLOY_TOKEN=$env:GITHUB_DEPLOY_TOKEN",
            "DEPLOY_WEBHOOK_SECRET=$env:DEPLOY_WEBHOOK_SECRET",
            "APPREGENERA_API_BASE_URL=$env:APPREGENERA_API_BASE_URL",
            "APPREGENERA_SQL_CONNECTION_STRING=$env:APPREGENERA_SQL_CONNECTION_STRING",
            "APPREGENERA_ALLOWED_MODULES=$env:APPREGENERA_ALLOWED_MODULES",
            "APPREGENERA_DEV_BYPASS_KEY=$env:APPREGENERA_DEV_BYPASS_KEY"
          )

          $args = @(
            "webapp", "config", "appsettings", "set",
            "--name", $env:WEBAPP_NAME,
            "--resource-group", $env:RESOURCE_GROUP,
            "--settings"
          ) + $settings

          az @args

      - name: Restart backend
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp config set `
            --name $env:WEBAPP_NAME `
            --resource-group $env:RESOURCE_GROUP `
            --always-on true

          az webapp config set `
            --name $env:WEBAPP_NAME `
            --resource-group $env:RESOURCE_GROUP `
            --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port $env:WEBSITE_PORT"

          az webapp config set `
            --name $env:WEBAPP_NAME `
            --resource-group $env:RESOURCE_GROUP `
            --generic-configurations '{"healthCheckPath":"/health"}'

          az webapp restart --name $env:WEBAPP_NAME --resource-group $env:RESOURCE_GROUP

      - name: Wait for backend health
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          $maxAttempts = 60
          $stableChecks = 0
          Write-Host "Esperando a que el backend sirva la imagen $env:IMAGE_TAG"
          Start-Sleep -Seconds 30
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $response = Invoke-RestMethod -Method Get -Uri "$env:BACKEND_URL/health" -TimeoutSec 20
              if ($response.chat_router_error) {
                throw "Error cargando rutas de chat: $($response.chat_router_error)"
              }
              $isExpectedImage = $response.deployment_image_tag -eq $env:IMAGE_TAG
              $isReady = $response.status -eq "ok" -and $response.runtime_ready -eq $true
              if ($isReady -and $isExpectedImage) {
                $stableChecks += 1
                Write-Host "Health correcto ($stableChecks/3) para imagen $env:IMAGE_TAG"
              } else {
                $stableChecks = 0
                Write-Host "Backend vivo pero no listo para esta imagen (intento $attempt/$maxAttempts): $($response | ConvertTo-Json -Compress)"
              }
              if ($stableChecks -ge 3) {
                Write-Host "Health check estable en $env:BACKEND_URL/health"
                exit 0
              }
            } catch {
              $stableChecks = 0
              Write-Host "Backend aun arrancando (intento $attempt/$maxAttempts)"
            }
            Start-Sleep -Seconds 10
          }
          Write-Host "Diagnostico App Service tras fallo de health"
          az webapp show --resource-group $env:RESOURCE_GROUP --name $env:WEBAPP_NAME --query "{state:state, availabilityState:availabilityState, hostNames:hostNames, containerSize:siteConfig.containerSize, linuxFxVersion:siteConfig.linuxFxVersion, appCommandLine:siteConfig.appCommandLine}" -o json
          az webapp log download --resource-group $env:RESOURCE_GROUP --name $env:WEBAPP_NAME --log-file appservice-logs.zip
          if (Test-Path appservice-logs.zip) {
            Expand-Archive -Path appservice-logs.zip -DestinationPath appservice-logs -Force
            Get-ChildItem -Path appservice-logs -Recurse | Select-Object -First 40 | Format-Table -AutoSize
            Get-ChildItem -Path appservice-logs -Recurse -File | Where-Object { $_.Name -match 'docker|container|application|default' } | Select-Object -First 8 | ForEach-Object {
              Write-Host "===== LOG $($_.FullName) ====="
              Get-Content -LiteralPath $_.FullName -Tail 120
            }
          }
          throw "El backend no respondió correctamente en /health"

      - name: Trigger document sync
        if: ${{ inputs.action == 'full' || inputs.action == 'backend' }}
        shell: pwsh
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          $headers = @{ "x-admin-key" = $env:ADMIN_API_KEY }
          Write-Host "Lanzando sync de documentos en $env:BACKEND_URL/admin/sync ..."
          try {
            $result = Invoke-RestMethod -Method Post -Uri "$env:BACKEND_URL/admin/sync" -Headers $headers -TimeoutSec 600
            Write-Host "Sync completado: $($result | ConvertTo-Json -Compress)"
          } catch {
            $detail = ""
            try {
              $stream = $_.Exception.Response.GetResponseStream()
              if ($stream) { $detail = [System.IO.StreamReader]::new($stream).ReadToEnd() }
            } catch {}
            Write-Warning "Sync fallido (no bloquea el despliegue): $($_.Exception.Message). Detalle: $detail"
          }

      - name: Generate frontend config.js
        if: ${{ inputs.action == 'full' || inputs.action == 'frontend' }}
        shell: pwsh
        run: |
          $content = @"
          window.CHATBOT_CONFIG = {
            API_BASE_URL: "/api",
            ENTRA_ENABLED: true,
            ENTRA_TENANT_ID: "$env:ENTRA_TENANT_ID",
            ENTRA_CLIENT_ID: "$env:ENTRA_CLIENT_ID",
            ENTRA_API_SCOPE: "$env:ENTRA_API_SCOPE"
          };
          "@
          Set-Content -LiteralPath "src/frontend/config.js" -Value $content -Encoding UTF8

      - name: Deploy frontend to Static Web Apps
        if: ${{ inputs.action == 'full' || inputs.action == 'frontend' }}
        shell: pwsh
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npx -y @azure/static-web-apps-cli deploy src/frontend --deployment-token $env:SWA_DEPLOYMENT_TOKEN --env production

      - name: Validate published frontend config
        if: ${{ inputs.action == 'full' || inputs.action == 'frontend' }}
        shell: pwsh
        run: |
          $configResponse = Invoke-WebRequest -Uri "$env:STATIC_WEB_APP_HOST/config.js" -UseBasicParsing -TimeoutSec 30
          if ($configResponse.Content -notmatch 'API_BASE_URL:\s*"/api"') {
            throw "El config.js publicado no contiene la ruta /api"
          }

      - name: Deployment summary
        shell: pwsh
        run: |
          @"
          Deploy completado.
          Branch: ${{ inputs.branch }}
          Action: ${{ inputs.action }}
          Backend: $env:BACKEND_URL
          Frontend: $env:STATIC_WEB_APP_HOST
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Notify chatbot deployment webhook
        if: ${{ always() }}
        shell: pwsh
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_WEBHOOK_SECRET)) {
            Write-Warning "DEPLOY_WEBHOOK_SECRET no configurado. Se omite el webhook."
            exit 0
          }

          $webhookUrl = "$env:STATIC_WEB_APP_API_BASE/admin/deployments/webhook"
          try {
            $health = Invoke-RestMethod -Method Get -Uri "$env:BACKEND_URL/health" -TimeoutSec 20
            if (-not ($health.status -eq "ok" -and $health.runtime_ready -eq $true -and $health.deployment_image_tag -eq $env:IMAGE_TAG)) {
              Write-Host "Webhook omitido: backend no listo para notificar. health=$($health | ConvertTo-Json -Compress)"
              exit 0
            }
          } catch {
            Write-Host "Webhook omitido: no se pudo comprobar /health antes de notificar: $($_.Exception.Message)"
            exit 0
          }

          $payload = @{
            run_id = [int64]"${{ github.run_id }}"
            run_number = [int]"${{ github.run_number }}"
            run_attempt = [int]"${{ github.run_attempt }}"
            workflow_name = "${{ github.workflow }}"
            branch = "${{ inputs.branch }}"
            requested_action = "${{ inputs.action }}"
            requested_by_email = "${{ inputs.requested_by_email }}"
            requested_by_name = "${{ inputs.requested_by_name }}"
            trigger_source = "${{ inputs.trigger_source }}"
            status = "completed"
            conclusion = "${{ job.status }}"
            actor = "${{ github.actor }}"
            html_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            logs_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            backend_url = "$env:BACKEND_URL"
            frontend_url = "$env:STATIC_WEB_APP_HOST"
            completed_at = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json -Depth 4

          try {
            Invoke-RestMethod `
              -Method Post `
              -Uri $webhookUrl `
              -ContentType "application/json" `
              -Headers @{ "x-deploy-webhook-secret" = $env:DEPLOY_WEBHOOK_SECRET } `
              -Body $payload `
              -TimeoutSec 120 | Out-Null
          } catch {
            $detail = $_.ErrorDetails.Message
            if ([string]::IsNullOrWhiteSpace($detail) -and $_.Exception.Response) {
              try {
                $stream = $_.Exception.Response.GetResponseStream()
                if ($stream) {
                  $reader = [System.IO.StreamReader]::new($stream)
                  $detail = $reader.ReadToEnd()
                }
              } catch {}
            }
            if ([string]::IsNullOrWhiteSpace($detail)) {
              Write-Warning "No se pudo notificar el webhook del chatbot: $($_.Exception.Message)"
            } else {
              Write-Warning "No se pudo notificar el webhook del chatbot: $($_.Exception.Message). Detalle: $detail"
            }
          }

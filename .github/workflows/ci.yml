name: Validate Chatbot

on:
  pull_request:
  push:
    branches:
      - sandbox

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.4.1+cpu"
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.3 ruff==0.15.16

      - name: Static checks
        run: |
          python -m compileall -q .
          ruff check .

      - name: Tests
        run: python -m pytest tests -q
